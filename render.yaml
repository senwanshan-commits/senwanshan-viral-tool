services:
  - type: web
    name: senwanshan-viral-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: API_KEY
        sync: false
      - key: BASE_URL
        value: https://api.deepseek.com
      - key: MODEL
        value: deepseek-chat
      - key: PORT
        value: "9100"
      - key: TEMPERATURE
        value: "0.8"
